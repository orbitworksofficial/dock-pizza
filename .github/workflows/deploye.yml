name: Deploy to cPanel

on:
  push:
    branches:
      - main   # change to "master" if that's your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Assets are built here rather than committed, so the repo stays clean
      # and a push always deploys freshly compiled CSS/JS.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Document root is public_html, and the live site loads assets from
      # /build/assets/... — so the manifest must sit at public_html/build.
      # Vite writes to public/build, so move it up one level.
      - name: Move build output to deploy location
        run: |
          rm -rf ./build
          mv ./public/build ./build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./public_html/
          # Excluded paths are skipped entirely — never uploaded and never
          # deleted — so the server's own .env and storage stay untouched.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/tests/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/logs/**
            **/.env
            **/.env.*
            **/*.md
            **/phpunit.xml
            **/vite.config.js
